# GitHub Pages へ自動で公開するための設定。
# main ブランチに変更を push すると、このワークフローが動いてサイトが更新される。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # GitHub の Actions 画面から手動でも実行できるようにする
  workflow_dispatch:

# GitHub Pages への書き込み権限
permissions:
  contents: read
  pages: write
  id-token: write

# 公開処理が重ならないようにする
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 必要な部品をインストール
        run: npm ci

      - name: テストを実行（失敗したら公開しない）
        run: npm test

      - name: ビルド（公開用のファイルを作る）
        run: npm run build

      - name: Pages の設定を読み込む
        uses: actions/configure-pages@v5

      - name: 公開用ファイルをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へ公開
        id: deployment
        uses: actions/deploy-pages@v4
