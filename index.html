<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- スマホ縦画面ファースト。ユーザー拡大は許可しつつ、初期倍率を固定する -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3366f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WordClimb" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <title>WordClimb 英単語</title>
    <script>
      // ダークモードのちらつき防止：Reactが動く前に <html> のクラスを決める
      (function () {
        try {
          var raw = localStorage.getItem('wordclimb.v1');
          var mode = raw ? (JSON.parse(raw).settings || {}).darkMode : 'auto';
          var dark =
            mode === 'dark' ||
            ((mode === 'auto' || !mode) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* 壊れていても何もしない */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
